name: DAZZA Web Build

on:
  push:
    branches:
      - dazza-web-mvp
    paths:
      - "web/**"
      - ".github/workflows/dazza-web-build.yml"
  pull_request:
    branches:
      - dazza-web-mvp
    paths:
      - "web/**"
      - ".github/workflows/dazza-web-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run build
