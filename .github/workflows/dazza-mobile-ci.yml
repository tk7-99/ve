name: DAZZA Mobile CI

on:
  push:
    branches:
      - dazza-web-mvp
    paths:
      - "mobile/**"
      - "gateway/**"
      - "scripts/**"
      - "docs/**"
      - "README.ar.md"
      - ".github/workflows/dazza-mobile-ci.yml"
  pull_request:
    branches:
      - dazza-web-mvp
    paths:
      - "mobile/**"
      - "gateway/**"
      - "scripts/**"
      - "docs/**"
      - "README.ar.md"
      - ".github/workflows/dazza-mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/requirements.txt
      - name: Install gateway dependencies
        working-directory: gateway
        run: pip install -r requirements.txt
      - name: Run gateway tests
        working-directory: gateway
        env:
          PYTHONPATH: .
        run: pytest -q

  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test
      - name: Build debug APK when service URLs are configured
        if: ${{ vars.DAZZA_API_URL != '' && vars.DAZZA_MATRIX_URL != '' }}
        working-directory: mobile
        run: |
          flutter build apk --debug \
            --dart-define=DAZZA_API_URL=${{ vars.DAZZA_API_URL }} \
            --dart-define=DAZZA_MATRIX_URL=${{ vars.DAZZA_MATRIX_URL }}
      - name: Upload debug APK
        if: ${{ vars.DAZZA_API_URL != '' && vars.DAZZA_MATRIX_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dazza-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
